<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical Research G-1</title>
<style>
  :root{--ink:#1b1f5e;--sun:#ffd84d;--pink:#ff4f8b;--mint:#3ddc97;--paper:#fffdf5;--red:#ff3b30}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--ink);
    background:var(--sun) radial-gradient(circle,rgba(27,31,94,.18) 2px,transparent 2.5px) 0 0/22px 22px}
  body.flash{animation:flash .5s steps(2) 3}
  @keyframes flash{50%{background-color:var(--pink)}}
  .card{width:min(92%,420px);background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:9px 9px 0 var(--ink);padding:28px 22px;text-align:center;position:relative;z-index:2}
  .hidden{display:none}
  h1{margin:6px 0 4px;font-size:27px;font-weight:900;letter-spacing:-.5px}
  p{margin:8px 0;line-height:1.45}
  .sub{color:#5b6090}
  .doc{width:74px;height:92px;margin:0 auto 8px;background:#fff;border:4px solid var(--ink);border-radius:8px 22px 8px 8px;position:relative;transform:rotate(-6deg);box-shadow:4px 4px 0 var(--ink)}
  .doc::before{content:"W";position:absolute;left:-16px;top:16px;width:34px;height:34px;background:#2b6cf0;color:#fff;border:3px solid var(--ink);border-radius:8px;font:900 20px/28px Arial,sans-serif}
  .doc i{position:absolute;left:24px;right:10px;height:5px;background:var(--ink);border-radius:3px}
  .btn{display:block;width:100%;margin-top:16px;padding:16px;font:900 17px "Trebuchet MS",Verdana,sans-serif;color:var(--ink);background:var(--mint);border:4px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
  .tiny{font-size:12px;color:#8a8fb5;margin-top:12px}

  .pct{font-size:64px;font-weight:900;line-height:1}
  .track{height:26px;margin:16px 0 10px;background:#fff;border:4px solid var(--ink);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--pink) 0 14px,#ff86ad 14px 28px);background-size:40px 100%;animation:slide .6s linear infinite;transition:width .45s ease-out}
  @keyframes slide{to{background-position:40px 0}}
  .card.err{background:#ffe3e0;animation:shake .35s linear 4}
  .card.err .fill{background:var(--red);animation:none}
  @keyframes shake{25%{transform:translateX(-10px) rotate(-1deg)}75%{transform:translateX(10px) rotate(1deg)}}

  #prankPage{overflow:visible}
  .stamp{display:inline-block;font-size:34px;font-weight:900;line-height:1.1;color:var(--pink);border:5px solid var(--pink);border-radius:12px;padding:10px 14px;margin:6px 0 12px;transform:rotate(-4deg);animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes slam{from{transform:scale(4) rotate(14deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
  .line{min-height:1.5em;font-weight:900}
  .line.soft{font-weight:400;color:#5b6090}
  .caret::after{content:"▌";animation:blink .5s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .pop{animation:pop .6s cubic-bezier(.2,1.8,.4,1) both,wiggle 1.6s ease-in-out .6s infinite}
  @keyframes pop{from{transform:scale(0) rotate(-12deg)}to{transform:scale(1) rotate(0)}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-2.5deg)}20%{transform:rotate(2.5deg)}30%{transform:rotate(0)}}

  .rain{position:fixed;top:-50px;font-size:30px;z-index:1;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.fill,.pop,body.flash{animation:none}}
</style>
</head>
<body>

<div class="card" id="downloadPage">
  <div class="doc"><i style="top:20px"></i><i style="top:36px"></i><i style="top:52px"></i><i style="top:68px;right:32px"></i></div>
  <h1>Practical Research G-1</h1>
  <p class="sub">Click below to download the research document.</p>
  <button class="btn" onclick="startPrank()">⬇️ Download Research File</button>
  <p class="tiny">Microsoft Word document • .docx</p>
</div>

<div class="card hidden" id="loadingPage">
  <div class="pct" id="pct">0%</div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <p id="status"><b>Connecting to server...</b></p>
</div>

<div class="card hidden" id="prankPage">
  <div class="stamp">It's a prank HaHahah 😹😹</div>
  <p class="line" id="l1"></p>
  <p class="line soft" id="l2"></p>
  <a id="realDownload" class="btn hidden" href="https://www.mediafire.com/file/x0bei4ikiodr8zw/PR+G-1+PROPOSAL+.docx/file" target="_blank" rel="noopener noreferrer">📄 Download Real Research File</a>
</div>

<script>
const $ = id => document.getElementById(id);
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };

function startPrank() {
  $("downloadPage").classList.add("hidden");
  $("loadingPage").classList.remove("hidden");

  const steps = [
    [400,  8, "Connecting to server..."],
    [1300, 27, "Downloading... "],
    [2300, 52, "Downloading... "],
    [3200, 78, "Downloading... "],
    [4000, 94, "Almost done... "],
    [4700, 99, "Almost done... 🤞"],
  ];
  steps.forEach(([t, p, m]) => setTimeout(() => {
    $("fill").style.width = p + "%";
    $("pct").textContent = p + "%";
    $("status").innerHTML = "<b>" + m + (m.endsWith(" ") ? p + "%" : "") + "</b>";
  }, t));

  // stuck at 99%...
  setTimeout(() => { $("status").innerHTML = "<b>Stuck at 99%... 🥶 wait lang</b>"; }, 6500);

  // fake error
  setTimeout(() => {
    const c = $("loadingPage");
    c.classList.add("err");
    $("pct").textContent = "⚠️ ERROR";
    $("status").innerHTML = "<b>Download failed: file is 100% prank 💀</b>";
    buzz([200,80,200]);
  }, 8500);

  // the reveal
  setTimeout(revealPrank, 10500);
}

function revealPrank() {
  $("loadingPage").classList.add("hidden");
  $("prankPage").classList.remove("hidden");
  document.body.classList.add("flash");
  buzz([120,60,120,60,300]);
  emojiRain();

  setTimeout(() => type($("l1"), "Joke! Mao bitaw ni ang link. Hehehe 😭😂", 45, () =>
    type($("l2"), "Pero naa gyud diri ang real research file. 👇", 35, () => {
      const b = $("realDownload");
      b.classList.remove("hidden");
      b.classList.add("pop");
      buzz(80);
    })), 700);
}

function type(el, text, speed, done) {
  const chars = Array.from(text);
  let i = 0;
  el.classList.add("caret");
  const timer = setInterval(() => {
    el.textContent = chars.slice(0, ++i).join("");
    if (i >= chars.length) {
      clearInterval(timer);
      el.classList.remove("caret");
      done && done();
    }
  }, speed);
}

function emojiRain() {
  const set = ["😹","😂","😭","🤣","💀","🫵"];
  let n = 0;
  const t = setInterval(() => {
    const e = document.createElement("div");
    e.className = "rain";
    e.textContent = set[Math.floor(Math.random() * set.length)];
    e.style.left = Math.random() * 100 + "vw";
    e.style.fontSize = 22 + Math.random() * 26 + "px";
    e.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 5500);
    if (++n > 70) clearInterval(t);
  }, 90);
}
</script>
</body>
</html>
